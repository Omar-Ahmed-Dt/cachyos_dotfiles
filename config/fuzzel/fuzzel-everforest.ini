[main]
font=JetBrainsMono Nerd Font:size=8
dpi-aware=auto
terminal=kitty
icons-enabled=no
prompt="  "
width=50
lines=15
anchor=center
use-bold=no
match-mode=fzf
sort-result=yes
match-counter=yes
exit-on-keyboard-focus-loss=yes
minimal-lines=yes

[colors]
background=2d353bff
selection=3d484dff
border=d3c6aaff
text=d3c6aaff
input=d3c6aaff
match=dbbc7fff
selection-text=d3c6aaff
prompt=dbbc7fff

[border]
width=1
radius=0

[dmenu]
exit-immediately-if-empty=yes

# ============================================================
# EVERFOREST DARK MEDIUM
# ============================================================

[colors-dark]


# ============================================================
# BASE COLORS
# ============================================================

foreground=d3c6aa
background=2f383e

# Background opacity (0.0 = fully transparent, 1.0 = fully opaque)
# alpha=1.0


# ============================================================
# ANSI REGULAR COLORS
# ============================================================

# Black
regular0=4b565c

# Red
regular1=e67e80

# Green
regular2=a7c080

# Yellow
regular3=dbbc7f

# Blue
regular4=7fbbb3

# Magenta / Purple
regular5=d699b6

# Cyan / Aqua
regular6=83c092

# White
regular7=d3c6aa


# ============================================================
# ANSI BRIGHT COLORS
# ============================================================

# Bright Black / Grey
bright0=4b565c

# Bright Red
bright1=e67e80

# Bright Green
bright2=a7c080

# Bright Yellow
bright3=dbbc7f

# Bright Blue
bright4=7fbbb3

# Bright Magenta
bright5=d699b6

# Bright Cyan
bright6=83c092

# Bright White
bright7=d3c6aa


# ============================================================
# CURSOR COLOR
#
# format:
# cursor=<text-color> <cursor-color>
# ============================================================

cursor=2f383e d3c6aa


# ============================================================
# SELECTION
# ============================================================

selection-foreground=d3c6aa
selection-background=543a48


# ============================================================
# URL
# ============================================================

urls=7fbbb3


# ============================================================
# SCROLLBACK INDICATOR
# ============================================================

scrollback-indicator=2f383e a7c080


# ============================================================
# SEARCH BOX
# ============================================================

search-box-no-match=2f383e e67e80
search-box-match=2f383e a7c080


# ============================================================
# URL JUMP LABEL
# ============================================================

jump-labels=2f383e dbbc7f

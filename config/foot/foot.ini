# ============================================================
# MAIN
# ============================================================

[main]

# JetBrains Mono Nerd Font
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
font-italic=JetBrainsMono Nerd Font:slant=italic:size=11
font-bold-italic=JetBrainsMono Nerd Font:weight=bold:slant=italic:size=11

# Font zoom increment
font-size-adjustment=0.5

# Terminal type
term=foot

# Padding: horizontal x vertical
pad=10x10

# Use [colors-dark]
initial-color-theme=dark

# Mouse selection only fills primary selection (for middle-click paste);
# clipboard buffer is only changed by explicit copy (Control+Shift+c or external Control+c)
selection-target=primary

# Use actual bold font instead of brightening colors
bold-text-in-bright=no


# ============================================================
# SCROLLBACK
# ============================================================

[scrollback]

lines=10000
multiplier=3.0
indicator-position=relative


# ============================================================
# CURSOR
# ============================================================

[cursor]

style=beam
blink=no
beam-thickness=1.5


# ============================================================
# MOUSE
# ============================================================

[mouse]

hide-when-typing=no
alternate-scroll-mode=yes


# ============================================================
# URL
# ============================================================

[url]

launch=xdg-open ${url}
osc8-underline=url-mode
style=dotted


# ============================================================
# KEY BINDINGS
# ============================================================

[key-bindings]

# Scrollback
scrollback-up-page=Control+Shift+Up Control+Shift+u
scrollback-down-page=Control+Shift+Down Control+Shift+d
scrollback-home=Control+Shift+a
scrollback-end=Control+Shift+e

# Clipboard
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v Control+v
primary-paste=Control+Shift+s

# Search
search-start=Control+Shift+r

# Font size
font-increase=Control+Shift+equal
font-decrease=Control+Shift+minus
font-reset=Control+Shift+0

# Spawn another foot terminal (disabled)
spawn-terminal=none

# Window actions disabled
minimize=none
maximize=none
fullscreen=none

# URLs
show-urls-launch=Control+Shift+o
show-urls-persistent=none
show-urls-copy=none

# Shell integration prompt navigation
prompt-prev=Control+Shift+p
prompt-next=Control+Shift+n

# Unicode input
unicode-input=none

# Disable direct quit shortcut
quit=none


# ============================================================
# SEARCH BINDINGS
# ============================================================

[search-bindings]

cancel=Control+c Escape
commit=Return KP_Enter
find-next=Control+Shift+n
find-prev=Control+Shift+p

# ============================================================
# URL BINDINGS
# ============================================================

[url-bindings]

cancel=Control+c Escape
toggle-url-visible=v


# ============================================================
# MOUSE BINDINGS
# ============================================================

[mouse-bindings]

primary-paste=BTN_MIDDLE

select-begin=BTN_LEFT
select-begin-block=Control+BTN_LEFT

select-extend=BTN_RIGHT
select-extend-character-wise=Control+BTN_RIGHT

select-word=BTN_LEFT-2
select-word-whitespace=Control+BTN_LEFT-2

select-quote=BTN_LEFT-3
select-row=BTN_LEFT-4


# ============================================================
# EVERFOREST DARK MEDIUM
# ============================================================

[colors-dark]


# ============================================================
# BASE COLORS
# ============================================================

foreground=d3c6aa
background=2f383e

# Background opacity (0.0 = fully transparent, 1.0 = fully opaque)
alpha=1.0


# ============================================================
# ANSI REGULAR COLORS
# ============================================================

# Black
regular0=4b565c

# Red
regular1=e67e80

# Green
regular2=a7c080

# Yellow
regular3=dbbc7f

# Blue
regular4=7fbbb3

# Magenta / Purple
regular5=d699b6

# Cyan / Aqua
regular6=83c092

# White
regular7=d3c6aa


# ============================================================
# ANSI BRIGHT COLORS
# ============================================================

# Bright Black / Grey
bright0=4b565c

# Bright Red
bright1=e67e80

# Bright Green
bright2=a7c080

# Bright Yellow
bright3=dbbc7f

# Bright Blue
bright4=7fbbb3

# Bright Magenta
bright5=d699b6

# Bright Cyan
bright6=83c092

# Bright White
bright7=d3c6aa


# ============================================================
# CURSOR COLOR
#
# format:
# cursor=<text-color> <cursor-color>
# ============================================================

cursor=2f383e d3c6aa


# ============================================================
# SELECTION
# ============================================================

selection-foreground=d3c6aa
selection-background=543a48


# ============================================================
# URL
# ============================================================

urls=7fbbb3


# ============================================================
# SCROLLBACK INDICATOR
# ============================================================

scrollback-indicator=2f383e a7c080


# ============================================================
# SEARCH BOX
# ============================================================

search-box-no-match=2f383e e67e80
search-box-match=2f383e a7c080


# ============================================================
# URL JUMP LABEL
# ============================================================

jump-labels=2f383e dbbc7f
